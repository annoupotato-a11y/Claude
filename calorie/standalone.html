<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カロリー手帳">
<meta name="theme-color" content="#f6f8f2">
<title>カロリー手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ===== カロリー手帳 : 食品の「栄養成分表示」ラベルを下敷きにしたUI =====
 * レイアウト: 1カラム（最大 640px）。合計リング → 撮影ボタン → ラベル型の編集欄 → 食事カード */
:root {
  --bg:        #f6f8f2;   /* 少し緑がかった紙 */
  --card:      #ffffff;
  --ink:       #1d2419;
  --ink-soft:  #5f6b5a;
  --line:      #dbe2d3;
  --accent:    #2e6b3f;   /* ほうれん草の緑 */
  --accent-ink:#ffffff;
  --accent-bg: #e3eedf;
  --over:      #b0412e;   /* 目標超過 */
  --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --font-body:    'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121612; --card: #1b211b; --ink: #e6ece2; --ink-soft: #9aa694; --line: #2e372d;
    --accent: #7cc48d; --accent-ink: #0f1a12; --accent-bg: #223024; --over: #ec8a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121612; --card: #1b211b; --ink: #e6ece2; --ink-soft: #9aa694; --line: #2e372d;
  --accent: #7cc48d; --accent-ink: #0f1a12; --accent-bg: #223024; --over: #ec8a72;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.app-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.app-header__inner, main {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app-header__inner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px;
}
.app-title { margin: 0; font: 20px/1.2 var(--font-display); letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; background: var(--accent-bg); padding: 3px; border-radius: 999px; }
.tab {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 999px;
  font-weight: 700; font-size: 14px; color: var(--ink-soft);
}
.tab.is-active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

main { padding-block: 14px calc(40px + env(safe-area-inset-bottom, 0px)); }
.view { display: none; flex-direction: column; gap: 16px; }
.view.is-active { display: flex; }

/* ---------- 日付 ---------- */
.day-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.day-nav__date { position: relative; font-weight: 700; font-size: 17px; padding: 4px 6px; }
.day-nav__date input {
  position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer;
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); font-size: 20px; line-height: 1;
}
.text-btn {
  border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 6px;
}
.sync { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

/* ---------- 合計 ---------- */
.summary {
  display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 18px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px;
}
.ring { position: relative; width: 148px; max-width: 100%; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring__track { fill: none; stroke: var(--accent-bg); stroke-width: 10; }
.ring__value {
  fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
  transition: stroke-dashoffset .5s ease;
}
.ring.is-over .ring__value { stroke: var(--over); }
.ring__text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.ring__num { font: 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring__unit { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.summary__side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.remain { margin: 0; font-weight: 700; }
.remain strong { font: 22px/1 var(--font-display); font-weight: 400; margin: 0 2px; }
.remain.is-over { color: var(--over); }
.meters { display: flex; flex-direction: column; gap: 8px; }
.meter__row { display: flex; justify-content: space-between; font-size: 13px; }
.meter__row span:last-child { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meter__bar { height: 6px; border-radius: 3px; background: var(--accent-bg); overflow: hidden; }
.meter__fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s ease; }
.meter__fill.is-over { background: var(--over); }

@media (max-width: 480px) {
  .summary { grid-template-columns: 116px minmax(0, 1fr); gap: 14px; padding: 14px; }
  .ring__num { font-size: 24px; }
}
@media (max-width: 340px) {
  .summary { grid-template-columns: 1fr; justify-items: center; }
  .summary__side { width: 100%; }
}

/* ---------- 撮影 ---------- */
.capture { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.capture__btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 8px 10px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--card);
  font-weight: 700; font-size: 14px; text-align: center; cursor: pointer; white-space: nowrap;
}
.capture__btn--main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; }
.capture__btn svg { width: 24px; height: 24px; flex: none; }
.capture__btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.engine-note { margin: -6px 0 0; font-size: 13px; color: var(--ink-soft); }
.engine-note button { padding: 0; }

/* ---------- 編集欄 ---------- */
.editor {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 12px;
  scroll-margin-top: calc(72px + env(safe-area-inset-top, 0px));
}
.editor__head { display: flex; gap: 12px; align-items: flex-start; }
.editor__photo {
  width: 108px; height: 108px; object-fit: cover; border-radius: 8px; flex: none;
}
.editor__meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  flex: 1; border: 0; background: transparent; padding: 6px 0; font-size: 13px; font-weight: 700;
  color: var(--ink-soft);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.field-inline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.field-inline input { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--bg); }
.hint-row { display: flex; gap: 6px; flex-wrap: wrap; }
.hint-row input {
  flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; background: var(--bg); font-size: 13px;
}
@media (max-width: 420px) {
  .editor__head { flex-direction: column; }
  .editor__photo { width: 100%; height: 150px; }
  .editor__meta { width: 100%; }
}

.status {
  display: flex; align-items: center; gap: 10px; font-size: 14px;
  background: var(--accent-bg); border-radius: 8px; padding: 10px 12px;
}
.status .text-btn { margin-left: auto; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  border: 2px solid var(--accent); border-right-color: transparent;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  .ring__value, .meter__fill { transition: none; }
}
.ai-note { margin: 0; font-size: 13px; color: var(--ink-soft); }

/* 栄養成分表示ラベル：太い枠と罫線 */
.label { border: 2px solid var(--ink); padding: 8px 10px 10px; }
.label__title {
  font-weight: 700; font-size: 15px; border-bottom: 6px solid var(--ink); padding-bottom: 4px;
}
.label__title span { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.items { display: flex; flex-direction: column; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) 76px 28px;
  grid-template-areas: "name kcal del" "pfc pfc pfc";
  gap: 4px 6px; padding: 8px 0; border-bottom: 1px solid var(--ink);
}
.item input {
  min-width: 0; width: 100%; border: 0; border-bottom: 1px dashed var(--line);
  background: transparent; padding: 2px 0;
}
.item input:focus { border-bottom-color: var(--accent); outline: none; }
.item__name { grid-area: name; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item__name input:first-child { font-weight: 700; }
.item__name input:last-child { font-size: 13px; color: var(--ink-soft); }
.item__kcal { grid-area: kcal; display: flex; align-items: baseline; gap: 2px; }
.item__kcal input { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.item__kcal small, .item__pfc small { font-size: 11px; color: var(--ink-soft); }
.item__pfc { grid-area: pfc; display: flex; gap: 12px; font-size: 13px; }
.item__pfc label { display: flex; align-items: baseline; gap: 4px; color: var(--ink-soft); }
.item__pfc input { width: 44px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.item__del {
  grid-area: del; border: 0; background: none; color: var(--ink-soft); font-size: 18px; line-height: 1;
}
.add-item {
  width: 100%; border: 0; background: none; color: var(--accent); font-weight: 700;
  text-align: left; padding: 8px 0; border-bottom: 3px solid var(--ink);
}
.label__total { margin: 6px 0 0; display: grid; grid-template-columns: 1fr auto; font-variant-numeric: tabular-nums; }
.label__total dt, .label__total dd { margin: 0; padding: 3px 0; border-bottom: 1px solid var(--line); }
.label__total dd { text-align: right; }
.label__total dt:first-child, .label__total dd:nth-child(2) { font-weight: 700; font-size: 17px; }
.label__total dt:last-of-type, .label__total dd:last-child { border-bottom: 0; }

.editor__actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.editor__actions .btn--danger { margin-right: auto; }

/* ---------- ボタン共通 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 42px; padding: 8px 18px; border-radius: 999px; font-weight: 700;
  border: 1px solid var(--line); background: var(--card); cursor: pointer;
}
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn--ghost { background: transparent; }
.btn--danger { color: var(--over); border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- 食事カード ---------- */
.meals { display: flex; flex-direction: column; gap: 14px; }
.meal-group h3 {
  display: flex; justify-content: space-between; margin: 0 0 6px; font-size: 14px; color: var(--ink-soft);
}
.meal-group h3 span { font-variant-numeric: tabular-nums; }
.meal {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 8px 12px 8px 8px;
}
.meal + .meal { margin-top: 6px; }
.meal__thumb {
  width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--accent-bg);
  display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 12px;
}
.meal__body { min-width: 0; }
.meal__names { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meal__sub { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meal__kcal { font: 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.meal__kcal small { font: 11px var(--font-body); color: var(--ink-soft); margin-left: 2px; }
.empty {
  text-align: center; color: var(--ink-soft); padding: 26px 12px; border: 1px dashed var(--line);
  border-radius: var(--radius); font-size: 14px;
}
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* ---------- 推移 ---------- */
.week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title { margin: 0; font-size: 17px; }
.week-avg { margin: 0; color: var(--ink-soft); font-size: 14px; }
.week-avg strong { color: var(--ink); }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px 4px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-soft); font: 11px var(--font-body); }
.chart .bar { fill: var(--accent); }
.chart .bar.is-over { fill: var(--over); }
.chart .bar-hit { fill: transparent; cursor: pointer; }
.chart .bar-hit:hover + .bar, .chart .bar-hit:focus + .bar { opacity: .8; }
.chart .goal-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .val { fill: var(--ink); font-weight: 700; }
.chart-tip { margin: -8px 0 0; font-size: 12px; color: var(--ink-soft); }
.table-wrap { overflow-x: auto; }
.week-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.week-table th, .week-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.week-table th:first-child, .week-table td:first-child { text-align: left; }
.week-table th { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.week-table .is-over { color: var(--over); font-weight: 700; }

/* ---------- 設定 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
}
.card > .field, .card > .calc { width: 100%; }
.card__lead { margin: 0; font-weight: 700; }
.card__note { margin: 0; font-size: 13px; color: var(--ink-soft); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-soft); }
.field input, .field select {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg);
  font-size: 16px; width: 100%; min-width: 0;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.calc summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 14px; }
.calc[open] { display: flex; flex-direction: column; gap: 10px; }
.calc__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.field--wide { grid-column: 1 / -1; }
.calc__out { margin: 0; font-size: 14px; }
.calc__out strong { font: 20px var(--font-display); font-weight: 400; }

/* ---------- 通知 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 14px; max-width: calc(100% - 32px); transition: opacity .2s, transform .2s; z-index: 20;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title">カロリー手帳</h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="day" aria-selected="true">記録</button>
      <button class="tab" role="tab" data-view="week" aria-selected="false">推移</button>
      <button class="tab" role="tab" data-view="settings" aria-selected="false">設定</button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 記録（1日分）============ -->
  <section id="view-day" class="view is-active">
    <div class="day-nav">
      <button type="button" class="icon-btn" id="prevDay" aria-label="前の日">‹</button>
      <label class="day-nav__date">
        <span id="dayLabel"></span>
        <input type="date" id="dayInput" aria-label="日付を選ぶ">
      </label>
      <button type="button" class="icon-btn" id="nextDay" aria-label="次の日">›</button>
      <button type="button" class="text-btn" id="todayBtn" hidden>今日</button>
      <span class="sync" id="sync" hidden></span>
    </div>

    <!-- 1日の合計 -->
    <div class="summary">
      <div class="ring" id="ring" role="img" aria-label="">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring__track" cx="60" cy="60" r="52"></circle>
          <circle class="ring__value" id="ringValue" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring__text">
          <span class="ring__num" id="eatenKcal">0</span>
          <span class="ring__unit">/ <span id="goalKcal">2000</span> kcal</span>
        </div>
      </div>
      <div class="summary__side">
        <p class="remain" id="remain"></p>
        <div class="meters" id="meters"></div>
      </div>
    </div>

    <!-- 撮る -->
    <div class="capture">
      <label class="capture__btn capture__btn--main">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1.5 2H20a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3.5L9 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        写真を撮る
      </label>
      <label class="capture__btn">
        <input type="file" id="libraryInput" accept="image/*" hidden>
        写真を選ぶ
      </label>
      <button type="button" class="capture__btn" id="manualBtn">手で入力</button>
    </div>
    <p class="engine-note" id="engineNote" hidden></p>

    <!-- 解析と編集 -->
    <section class="editor" id="editor" hidden aria-label="食事の内容">
      <div class="editor__head">
        <img id="editorPhoto" class="editor__photo" alt="" hidden>
        <div class="editor__meta">
          <div class="seg" id="mealType" role="radiogroup" aria-label="食事の種類">
            <button type="button" data-type="breakfast" role="radio">朝食</button>
            <button type="button" data-type="lunch" role="radio">昼食</button>
            <button type="button" data-type="dinner" role="radio">夕食</button>
            <button type="button" data-type="snack" role="radio">間食</button>
          </div>
          <label class="field-inline">時刻 <input type="time" id="mealTime"></label>
          <div class="hint-row" id="hintRow">
            <input type="text" id="hintInput" placeholder="補足（例：ご飯は半分、ドレッシングなし）">
            <button type="button" class="text-btn" id="reanalyzeBtn">もう一度解析</button>
          </div>
        </div>
      </div>

      <div class="status" id="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="statusText">写真を解析しています…</span>
        <button type="button" class="text-btn" id="stopBtn">中止</button>
      </div>
      <p class="ai-note" id="aiNote" hidden></p>

      <!-- 栄養成分表示 -->
      <div class="label" id="labelBox">
        <div class="label__title">栄養成分表示<span>（推定）</span></div>
        <div class="items" id="items"></div>
        <button type="button" class="add-item" id="addItem">＋ 品目を追加</button>
        <dl class="label__total" id="labelTotal"></dl>
      </div>

      <div class="editor__actions">
        <button type="button" class="btn btn--ghost" id="cancelBtn">やめる</button>
        <button type="button" class="btn btn--danger" id="deleteBtn" hidden>削除</button>
        <button type="button" class="btn btn--primary" id="saveBtn">記録する</button>
      </div>
    </section>

    <!-- その日の食事 -->

  <!-- ============ 推移 ============ -->

  <!-- ============ 設定 ============ -->

          <label class="field field--wide">ふだんの活動量
            <select id="pActivity">
              <option value="1.5">低い（座っていることが多い）</option>
              <option value="1.75" selected>ふつう（通勤・家事・軽い運動）</option>
              <option value="2.0">高い（立ち仕事・よく運動する）</option>
            </select>
          </label>
          <label class="field field--wide">目的
            <select id="pPlan">
              <option value="-400">減量（1日 -400kcal）</option>
              <option value="0" selected>維持</option>
              <option value="300">増量（1日 +300kcal）</option>
            </select>
          </label>
        </div>
        <p class="calc__out" id="calcOut"></p>
        <button type="button" class="btn btn--ghost" id="applyCalc">この値を目標にする</button>

      <button type="submit" class="btn btn--primary">保存</button>

    <form class="card" id="keyForm">
      <h2 class="section-title">写真の解析</h2>
      <p class="card__lead" id="engineState"></p>

        <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
      </label>
      <p class="card__note">キーはこの端末のブラウザにだけ保存され、解析時に Anthropic へ直接送られます。claude.ai 上で開いているときはキーは不要です。</p>
      <div class="row">
        <button type="submit" class="btn btn--primary">キーを保存</button>
        <button type="button" class="btn btn--ghost" id="clearKey">キーを消す</button>
      </div>
    </form>

    <div class="card">
      <h2 class="section-title">データ</h2>
      <p class="card__note" id="dataState"></p>
      <div class="row">
        <button type="button" class="btn btn--ghost" id="exportBtn">バックアップを書き出す</button>
        <label class="btn btn--ghost">読み込む<input type="file" id="importInput" accept="application/json,.json" hidden></label>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* カロリー手帳 : 写真から食事のカロリーを推定して1日ごとに記録する
 *
 * 解析は2通り。claude.ai の Artifact として開いたときは閲覧者の Claude（sample 機能）を使い、
 * それ以外では設定に入れた Anthropic API キーでブラウザから直接 Messages API を呼ぶ。
 * どちらも使えないときは手入力だけで記録できる。
 */
(() => {
  'use strict';

  const MEALS_KEY = 'calorie-note/meals/v1';
  const SETTINGS_KEY = 'calorie-note/settings/v1';
  const API_KEY_KEY = 'calorie-note/api-key';   // 端末の外には出さない
  const MODEL = 'claude-opus-5-5';
  const TYPES = { breakfast: '朝食', lunch: '昼食', dinner: '夕食', snack: '間食' };
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
  // PFC の目安（エネルギー比）: たんぱく質15% / 脂質25% / 炭水化物60%
  const PFC_RATIO = { p: [0.15, 4], f: [0.25, 9], c: [0.60, 4] };

  const $ = (id) => document.getElementById(id);
  const el = {
    tabs: document.querySelectorAll('.tab'),
    views: document.querySelectorAll('.view'),
    dayLabel: $('dayLabel'), dayInput: $('dayInput'), prevDay: $('prevDay'), nextDay: $('nextDay'),
    todayBtn: $('todayBtn'), sync: $('sync'),
    ring: $('ring'), ringValue: $('ringValue'), eatenKcal: $('eatenKcal'), goalKcal: $('goalKcal'),
    remain: $('remain'), meters: $('meters'),
    cameraInput: $('cameraInput'), libraryInput: $('libraryInput'), manualBtn: $('manualBtn'),
    engineNote: $('engineNote'),
    editor: $('editor'), editorPhoto: $('editorPhoto'), mealType: $('mealType'), mealTime: $('mealTime'),
    hintRow: $('hintRow'), hintInput: $('hintInput'), reanalyzeBtn: $('reanalyzeBtn'),
    status: $('status'), statusText: $('statusText'), stopBtn: $('stopBtn'), aiNote: $('aiNote'),
    items: $('items'), addItem: $('addItem'), labelTotal: $('labelTotal'),
    cancelBtn: $('cancelBtn'), deleteBtn: $('deleteBtn'), saveBtn: $('saveBtn'),
    meals: $('meals'),
    weekAvg: $('weekAvg'), weekChart: $('weekChart'), weekTable: $('weekTable'),
    goalForm: $('goalForm'), goalInput: $('goalInput'),
    pSex: $('pSex'), pAge: $('pAge'), pHeight: $('pHeight'), pWeight: $('pWeight'),
    pActivity: $('pActivity'), pPlan: $('pPlan'), calcOut: $('calcOut'), applyCalc: $('applyCalc'),
    keyForm: $('keyForm'), apiKey: $('apiKey'), clearKey: $('clearKey'), engineState: $('engineState'),
    dataState: $('dataState'), exportBtn: $('exportBtn'), importInput: $('importInput'),
    toast: $('toast'),
  };

  /* ---------- 小物 ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const today = () => ymd(new Date());
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : 0; };
  const round = (n) => Math.round(n);
  const round1 = (n) => Math.round(n * 10) / 10;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = (n) => round(n).toLocaleString('ja-JP');
  const dayText = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`; };

  function readJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  function readText(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
  function writeText(key, value) {
    try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch (e) { /* 保存できなくても続ける */ }
  }

  let toastTimer = 0;
  function toast(text) {
    el.toast.textContent = text;
    el.toast.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('is-show'), 2600);
  }

  const guessType = (date) => {
    const h = date.getHours();
    if (h >= 4 && h < 10) return 'breakfast';
    if (h >= 10 && h < 15) return 'lunch';
    if (h >= 17 && h < 22) return 'dinner';
    return 'snack';
  };

  /* ---------- データ ---------- */
  function normalizeItem(it) {
    if (!it || typeof it !== 'object') return null;
    return {
      name: String(it.name || '').slice(0, 60),
      amount: String(it.amount || '').slice(0, 30),
      kcal: round(num(it.kcal)),
      p: round1(num(it.p ?? it.protein)),
      f: round1(num(it.f ?? it.fat)),
      c: round1(num(it.c ?? it.carbs)),
    };
  }
  function normalizeMeal(m) {
    if (!m || typeof m !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(m.date || '')) return null;
    return {
      id: String(m.id || uid()),
      date: m.date,
      time: /^\d{2}:\d{2}$/.test(m.time || '') ? m.time : '12:00',
      type: TYPES[m.type] ? m.type : 'snack',
      items: (Array.isArray(m.items) ? m.items : []).map(normalizeItem).filter(Boolean),
      photo: typeof m.photo === 'string' && m.photo.startsWith('data:image/') ? m.photo : '',
      createdAt: m.createdAt || new Date().toISOString(),
      updatedAt: m.updatedAt || m.createdAt || new Date().toISOString(),
    };
  }
  const totals = (items) => items.reduce((t, it) => ({
    kcal: t.kcal + it.kcal, p: t.p + it.p, f: t.f + it.f, c: t.c + it.c,
  }), { kcal: 0, p: 0, f: 0, c: 0 });

  let meals = readJSON(MEALS_KEY, []).map(normalizeMeal).filter(Boolean);
  let settings = Object.assign({ goal: 2000, profile: {} }, readJSON(SETTINGS_KEY, {}));
  let currentDay = today();

  function persist() {
    if (!writeJSON(MEALS_KEY, meals)) toast('この端末の保存領域がいっぱいです。古い写真付きの記録を消すか、バックアップしてください');
  }
  const mealsOn = (date) => meals.filter((m) => m.date === date).sort((a, b) => a.time.localeCompare(b.time));

  /* ---------- クラウド保存（claude.ai で開いたときだけ）---------- */
  const cloud = { db: null, path: '' };

  function setSync(text) { el.sync.textContent = text; el.sync.hidden = !text; }

  async function connectCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([
      window.claude.use('db').catch(() => null),
      window.claude.use('user').catch(() => null),
    ]);
    if (!db || !user) return;
    const id = await user.id().catch(() => null);
    if (!id) return;
    // data/users/<id>/ は本人しか読めない場所。食事の記録はここに置く
    cloud.path = `data/users/${id}`;
    cloud.db = db;
    try {
      const snap = await db.collection(cloud.path).get();
      const remote = [];
      snap.docs.forEach((doc) => {
        if (doc.id === 'settings') {
          const s = doc.data();
          if (s && s.goal) settings = Object.assign(settings, { goal: s.goal, profile: s.profile || {} });
          return;
        }
        const m = normalizeMeal(Object.assign({ id: doc.id }, doc.data()));
        if (m) remote.push(m);
      });
      const remoteIds = new Set(remote.map((m) => m.id));
      const onlyHere = meals.filter((m) => !remoteIds.has(m.id));
      meals = remote.concat(onlyHere);
      persist();
      writeJSON(SETTINGS_KEY, settings);
      renderAll();
      for (const m of onlyHere) await pushMeal(m);
      if (onlyHere.length) toast(`${onlyHere.length}件の記録をクラウドへ移しました`);
      db.collection(cloud.path).onSnapshot((s) => {
        const next = [];
        s.docs.forEach((doc) => {
          if (doc.id === 'settings') return;
          const m = normalizeMeal(Object.assign({ id: doc.id }, doc.data()));
          if (m) next.push(m);
        });
        meals = next;
        persist();
        renderDay();
        renderWeek();
      }, () => setSync('この端末に保存'));
      setSync('☁ 同期中');
    } catch (e) {
      cloud.db = null;
      setSync('この端末に保存');
    }
  }
  function pushMeal(m) {
    if (!cloud.db) return Promise.resolve();
    const { id, ...rest } = m;
    return cloud.db.doc(`${cloud.path}/${id}`).set(rest)
      .catch(() => toast('クラウドに保存できませんでした（この端末には保存済み）'));
  }
  function dropMeal(id) {
    if (!cloud.db) return Promise.resolve();
    return cloud.db.doc(`${cloud.path}/${id}`).delete().catch(() => {});
  }
  function pushSettings() {
    if (!cloud.db) return;
    cloud.db.doc(`${cloud.path}/settings`).set({ goal: settings.goal, profile: settings.profile }).catch(() => {});
  }

  /* ---------- 画像 ---------- */
  async function loadImage(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 下で読む */ }
    }
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return img;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  function drawScaled(img, maxSide, square) {
    const w = img.width, h = img.height;
    const canvas = document.createElement('canvas');
    if (square) {
      const s = Math.min(w, h);
      canvas.width = canvas.height = Math.min(maxSide, s);
      canvas.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, canvas.width, canvas.height);
    } else {
      const k = Math.min(1, maxSide / Math.max(w, h));
      canvas.width = Math.round(w * k);
      canvas.height = Math.round(h * k);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    }
    return canvas;
  }
  const toBlob = (canvas, q) => new Promise((ok, ng) => canvas.toBlob((b) => (b ? ok(b) : ng(new Error('画像を変換できませんでした'))), 'image/jpeg', q));
  const blobToBase64 = (blob) => new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1]);
    r.onerror = () => ng(r.error);
    r.readAsDataURL(blob);
  });

  /* ---------- 解析エンジン ---------- */
  const engine = { sample: null, imagesOk: false };

  async function detectSample() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const sample = await window.claude.use('sample').catch(() => null);
    if (!sample) return;
    const limits = await sample.limits().catch(() => null);
    engine.sample = sample;
    engine.imagesOk = !!(limits && limits.images);
    renderEngine();
  }
  const engineKind = () => (engine.sample && engine.imagesOk ? 'claude' : readText(API_KEY_KEY) ? 'apikey' : 'none');

  function renderEngine() {
    const kind = engineKind();
    el.engineState.textContent = kind === 'claude'
      ? 'claude.ai のアカウントで解析します（キーは不要です）'
      : kind === 'apikey' ? 'API キーで解析します' : '解析の準備ができていません。API キーを入れるか、claude.ai で開いてください';
    el.engineNote.hidden = kind !== 'none';
    if (kind === 'none') {
      el.engineNote.innerHTML = '';
      el.engineNote.append('写真の解析には「設定」で API キーが必要です。写真なしの手入力はいつでも使えます。 ');
      const go = document.createElement('button');
      go.type = 'button';
      go.className = 'text-btn';
      go.textContent = '設定を開く';
      go.addEventListener('click', () => showView('settings'));
      el.engineNote.append(go);
    }
  }

  const PROMPT = (hint) => [
    'この写真の食事の栄養を推定してください。',
    '写っている料理・食品を1品ずつ挙げ、日本の一般的な1人前や、器・箸・手などの大きさから量を見積もり、',
    'それぞれのエネルギー(kcal)・たんぱく質(g)・脂質(g)・炭水化物(g)を日本食品標準成分表の値を目安に推定します。',
    '揚げ物の衣や油、ソース・ドレッシング、飲み物も見えていれば含めてください。',
    hint ? `食べた人からの補足（これを優先してください）: ${hint}` : '',
    '食べ物が写っていない場合は dishes を空にし、note にその旨を書いてください。',
    '',
    '次の形の JSON だけを返してください。name と amount と note は日本語で書きます。',
    '{"dishes":[{"name":"鶏の唐揚げ","amount":"5個（約150g）","kcal":420,"protein":28,"fat":26,"carbs":15}],',
    ' "confidence":"high|medium|low", "note":"推定の前提や見えにくかった点を1文で"}',
  ].filter(Boolean).join('\n');

  const RESULT_SCHEMA = {
    type: 'object',
    properties: {
      dishes: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' }, amount: { type: 'string' },
            kcal: { type: 'number' }, protein: { type: 'number' }, fat: { type: 'number' }, carbs: { type: 'number' },
          },
          required: ['name', 'amount', 'kcal', 'protein', 'fat', 'carbs'],
          additionalProperties: false,
        },
      },
      confidence: { type: 'string', enum: ['high', 'medium', 'low'] },
      note: { type: 'string' },
    },
    required: ['dishes', 'confidence', 'note'],
    additionalProperties: false,
  };

  class AnalyzeError extends Error {
    constructor(message, quiet) { super(message); this.quiet = !!quiet; }
  }

  async function analyzeWithClaude(blob, hint, signal) {
    try {
      return await engine.sample.json(PROMPT(hint), { images: [blob], signal, cache: false });
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') throw new AnalyzeError('', true);
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'images_unavailable') {
        engine.imagesOk = false;
        renderEngine();
        throw new AnalyzeError('この画面では Claude に写真を送れません。手入力するか、設定で API キーを入れてください');
      }
      if (code === 'rate_limited') throw new AnalyzeError('Claude の利用上限に達しました。しばらくしてから「もう一度解析」を押してください');
      if (code === 'image_rejected') throw new AnalyzeError('この画像は読み取れませんでした。別の写真で試してください');
      if (code === 'refused') throw new AnalyzeError('この写真は解析できませんでした。手で入力してください');
      if (code === 'session_expired') throw new AnalyzeError('claude.ai に再ログインしてから試してください');
      throw new AnalyzeError('解析に失敗しました。「もう一度解析」を押してください');
    }
  }

  async function analyzeWithApiKey(blob, hint, signal) {
    const data = await blobToBase64(blob);
    let res;
    try {
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal,
        headers: {
          'content-type': 'application/json',
          'x-api-key': readText(API_KEY_KEY),
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'server-side-fallback-2026-07-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 16000,
          fallbacks: 'default',
          output_config: { effort: 'medium', format: { type: 'json_schema', schema: RESULT_SCHEMA } },
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } },
              { type: 'text', text: PROMPT(hint) },
            ],
          }],
        }),
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new AnalyzeError('', true);
      throw new AnalyzeError('通信できませんでした。電波の状態を確かめてください');
    }
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      if (res.status === 401) throw new AnalyzeError('API キーが正しくありません。設定で入れ直してください');
      if (res.status === 429) throw new AnalyzeError('API の利用上限に達しました。少し待ってから試してください');
      if (res.status === 413) throw new AnalyzeError('画像が大きすぎます。別の写真で試してください');
      const msg = body && body.error && body.error.message;
      throw new AnalyzeError(`解析に失敗しました（${res.status}${msg ? `: ${msg}` : ''}）`);
    }
    if (body.stop_reason === 'refusal') throw new AnalyzeError('この写真は解析できませんでした。手で入力してください');
    const text = (body.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
    try { return JSON.parse(text); } catch (e) { throw new AnalyzeError('解析結果を読み取れませんでした。「もう一度解析」を押してください'); }
  }

  /* ---------- 編集欄 ---------- */
  let draft = null;          // 編集中の食事
  let draftBlob = null;      // 解析に送る画像（再解析用）
  let analyzing = null;      // AbortController

  function openEditor(meal, isNew) {
    draft = JSON.parse(JSON.stringify(meal));
    draft.isNew = isNew;
    el.editor.hidden = false;
    el.editorPhoto.hidden = !draft.photo;
    if (draft.photo) el.editorPhoto.src = draft.photo;
    el.mealTime.value = draft.time;
    el.hintInput.value = '';
    el.hintRow.hidden = !draftBlob;
    el.aiNote.hidden = true;
    el.deleteBtn.hidden = isNew;
    el.deleteBtn.textContent = '削除';
    delete el.deleteBtn.dataset.armed;
    el.saveBtn.textContent = isNew ? '記録する' : '更新する';
    renderType();
    renderItems();
    el.editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function closeEditor() {
    if (analyzing) analyzing.abort();
    draft = null;
    draftBlob = null;
    el.editor.hidden = true;
  }
  function renderType() {
    el.mealType.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.type === draft.type)));
  }

  function itemRow(it, i) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="item__name">
        <input type="text" data-k="name" placeholder="料理名" aria-label="料理名">
        <input type="text" data-k="amount" placeholder="量" aria-label="量">
      </div>
      <label class="item__kcal"><input type="number" data-k="kcal" min="0" inputmode="numeric" aria-label="エネルギー"><small>kcal</small></label>
      <button type="button" class="item__del" aria-label="この品目を消す">×</button>
      <div class="item__pfc">
        <label>P<input type="number" data-k="p" min="0" step="0.1" inputmode="decimal" aria-label="たんぱく質"><small>g</small></label>
        <label>F<input type="number" data-k="f" min="0" step="0.1" inputmode="decimal" aria-label="脂質"><small>g</small></label>
        <label>C<input type="number" data-k="c" min="0" step="0.1" inputmode="decimal" aria-label="炭水化物"><small>g</small></label>
      </div>`;
    row.querySelectorAll('input').forEach((input) => {
      const k = input.dataset.k;
      input.id = `item-${i}-${k}`;
      input.value = k === 'name' || k === 'amount' ? it[k] : (it[k] || it[k] === 0 ? it[k] : '');
      input.addEventListener('input', () => {
        draft.items[i][k] = k === 'name' || k === 'amount' ? input.value : num(input.value);
        renderLabelTotal();
      });
    });
    row.querySelector('.item__del').addEventListener('click', () => {
      draft.items.splice(i, 1);
      renderItems();
    });
    return row;
  }
  function renderItems() {
    el.items.replaceChildren(...draft.items.map(itemRow));
    renderLabelTotal();
  }
  function renderLabelTotal() {
    const t = totals(draft.items);
    el.labelTotal.innerHTML = `
      <dt>エネルギー</dt><dd>${fmt(t.kcal)} kcal</dd>
      <dt>たんぱく質</dt><dd>${round1(t.p)} g</dd>
      <dt>脂質</dt><dd>${round1(t.f)} g</dd>
      <dt>炭水化物</dt><dd>${round1(t.c)} g</dd>`;
  }

  async function runAnalysis() {
    if (!draftBlob || !draft) return;
    const kind = engineKind();
    if (kind === 'none') { renderEngine(); toast('解析の準備ができていません。手で入力するか、設定で API キーを入れてください'); return; }
    if (analyzing) analyzing.abort();
    const ctl = new AbortController();
    analyzing = ctl;
    el.status.hidden = false;
    el.statusText.textContent = '写真を解析しています…（30秒ほどかかることがあります）';
    el.aiNote.hidden = true;
    el.reanalyzeBtn.disabled = true;
    el.saveBtn.disabled = true;
    const target = draft;
    try {
      const hint = el.hintInput.value.trim();
      const result = kind === 'claude'
        ? await analyzeWithClaude(draftBlob, hint, ctl.signal)
        : await analyzeWithApiKey(draftBlob, hint, ctl.signal);
      if (draft !== target) return;
      const dishes = Array.isArray(result && result.dishes) ? result.dishes : [];
      draft.items = dishes.map(normalizeItem).filter(Boolean);
      const conf = { high: '確度：高', medium: '確度：中', low: '確度：低（量を確かめてください）' }[result && result.confidence] || '';
      const note = result && typeof result.note === 'string' ? result.note : '';
      el.aiNote.textContent = [conf, note].filter(Boolean).join('　');
      el.aiNote.hidden = !el.aiNote.textContent;
      if (!draft.items.length) toast('食べ物を見つけられませんでした。手で入力できます');
      renderItems();
    } catch (e) {
      if (!(e instanceof AnalyzeError && e.quiet)) toast(e.message || '解析に失敗しました');
    } finally {
      if (analyzing === ctl) analyzing = null;
      el.status.hidden = true;
      el.reanalyzeBtn.disabled = false;
      el.saveBtn.disabled = false;
    }
  }

  async function onPhoto(file) {
    if (!file) return;
    if (!/^image\//.test(file.type) && file.type) { toast('画像ファイルを選んでください'); return; }
    let img;
    try { img = await loadImage(file); } catch (e) { toast('この画像は開けませんでした（HEIC の場合はカメラ設定で「互換性優先」にしてください）'); return; }
    const sendCanvas = drawScaled(img, 1280, false);
    const thumbCanvas = drawScaled(img, 240, true);
    if (img.close) img.close();
    draftBlob = await toBlob(sendCanvas, 0.85);
    const thumb = thumbCanvas.toDataURL('image/jpeg', 0.72);
    const now = new Date();
    const date = currentDay;
    openEditor({
      id: uid(), date, time: hm(now), type: guessType(now), items: [], photo: thumb,
      createdAt: now.toISOString(), updatedAt: now.toISOString(),
    }, true);
    runAnalysis();
  }

  function startManual() {
    draftBlob = null;
    const now = new Date();
    openEditor({
      id: uid(), date: currentDay, time: hm(now), type: guessType(now),
      items: [{ name: '', amount: '', kcal: 0, p: 0, f: 0, c: 0 }], photo: '',
      createdAt: now.toISOString(), updatedAt: now.toISOString(),
    }, true);
    const first = el.items.querySelector('input');
    if (first) first.focus({ preventScroll: true });
  }

  function saveDraft() {
    if (!draft) return;
    const items = draft.items.map(normalizeItem).filter((it) => it.name || it.kcal);
    if (!items.length) { toast('品目を1つ以上入れてください'); return; }
    const { isNew, ...rest } = draft;
    const meal = normalizeMeal(Object.assign(rest, { items, time: el.mealTime.value || rest.time, updatedAt: new Date().toISOString() }));
    const i = meals.findIndex((m) => m.id === meal.id);
    if (i > -1) meals[i] = meal; else meals.push(meal);
    persist();
    pushMeal(meal);
    closeEditor();
    renderDay();
    renderWeek();
    toast(isNew ? `${TYPES[meal.type]}を記録しました（${fmt(totals(meal.items).kcal)} kcal）` : '更新しました');
  }

  function deleteDraft() {
    if (!draft || draft.isNew) return;
    // 確認ダイアログが使えない環境もあるので、ボタンを2回押して消す
    if (!el.deleteBtn.dataset.armed) {
      el.deleteBtn.dataset.armed = '1';
      el.deleteBtn.textContent = 'もう一度押すと削除';
      return;
    }
    const id = draft.id;
    meals = meals.filter((m) => m.id !== id);
    persist();
    dropMeal(id);
    closeEditor();
    renderDay();
    renderWeek();
    toast('削除しました');
  }

  /* ---------- 1日の表示 ---------- */
  const goalOf = (key) => (settings.goal * PFC_RATIO[key][0]) / PFC_RATIO[key][1];

  function renderDay() {
    const isToday = currentDay === today();
    el.dayLabel.textContent = isToday ? `今日・${dayText(currentDay)}` : dayText(currentDay);
    el.dayInput.value = currentDay;
    el.todayBtn.hidden = isToday;
    el.nextDay.disabled = currentDay >= today();

    const list = mealsOn(currentDay);
    const t = totals(list.flatMap((m) => m.items));
    const goal = settings.goal;
    const ratio = goal ? t.kcal / goal : 0;
    const circ = 2 * Math.PI * 52;
    el.ringValue.style.strokeDasharray = String(circ);
    el.ringValue.style.strokeDashoffset = String(circ * (1 - Math.min(1, ratio)));
    el.ring.classList.toggle('is-over', ratio > 1);
    el.ring.setAttribute('aria-label', `${fmt(t.kcal)} kcal / 目標 ${fmt(goal)} kcal`);
    el.eatenKcal.textContent = fmt(t.kcal);
    el.goalKcal.textContent = fmt(goal);
    const left = goal - t.kcal;
    el.remain.classList.toggle('is-over', left < 0);
    el.remain.innerHTML = left >= 0 ? `あと<strong>${fmt(left)}</strong>kcal` : `<strong>${fmt(-left)}</strong>kcal オーバー`;

    el.meters.replaceChildren(...[['p', 'たんぱく質'], ['f', '脂質'], ['c', '炭水化物']].map(([k, label]) => {
      const target = goalOf(k);
      const v = t[k];
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="meter__row"><span>${label}</span><span>${round(v)} / ${round(target)} g</span></div>
        <div class="meter__bar"><div class="meter__fill"></div></div>`;
      const fill = wrap.querySelector('.meter__fill');
      fill.style.width = `${Math.min(100, (v / target) * 100)}%`;
      fill.classList.toggle('is-over', v > target * 1.15);
      return wrap;
    }));

    if (!list.length) {
      el.meals.innerHTML = `<div class="empty"><strong>${isToday ? 'まだ今日の記録はありません' : 'この日の記録はありません'}</strong>食事の前に「写真を撮る」を押すと、カロリーと PFC を推定して記録できます</div>`;
      return;
    }
    const groups = Object.keys(TYPES).map((type) => [type, list.filter((m) => m.type === type)]).filter(([, l]) => l.length);
    el.meals.replaceChildren(...groups.map(([type, l]) => {
      const g = document.createElement('div');
      g.className = 'meal-group';
      const h = document.createElement('h3');
      h.innerHTML = `${TYPES[type]}<span>${fmt(totals(l.flatMap((m) => m.items)).kcal)} kcal</span>`;
      g.append(h);
      l.forEach((m) => g.append(mealCard(m)));
      return g;
    }));
  }

  function mealCard(m) {
    const t = totals(m.items);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'meal';
    const thumb = m.photo ? document.createElement('img') : document.createElement('div');
    thumb.className = 'meal__thumb';
    if (m.photo) { thumb.src = m.photo; thumb.alt = ''; } else thumb.textContent = '手入力';
    const body = document.createElement('div');
    body.className = 'meal__body';
    const names = document.createElement('div');
    names.className = 'meal__names';
    names.textContent = m.items.map((it) => it.name || '（名前なし）').join('、');
    const sub = document.createElement('div');
    sub.className = 'meal__sub';
    sub.textContent = `${m.time}　P ${round(t.p)}g・F ${round(t.f)}g・C ${round(t.c)}g`;
    body.append(names, sub);
    const kcal = document.createElement('div');
    kcal.className = 'meal__kcal';
    kcal.innerHTML = `${fmt(t.kcal)}<small>kcal</small>`;
    b.append(thumb, body, kcal);
    b.addEventListener('click', () => { draftBlob = null; openEditor(m, false); });
    return b;
  }

  /* ---------- 推移 ---------- */
  function renderWeek() {
    const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
    const rows = days.map((d) => {
      const list = mealsOn(d);
      return { d, n: list.length, ...totals(list.flatMap((m) => m.items)) };
    });
    const recorded = rows.filter((r) => r.n);
    el.weekAvg.innerHTML = recorded.length
      ? `記録した${recorded.length}日の平均 <strong>${fmt(recorded.reduce((s, r) => s + r.kcal, 0) / recorded.length)} kcal</strong>`
      : '';

    // 棒グラフ（1系列なので凡例なし。目標は破線）
    const W = 340, H = 180, top = 18, bottom = 30, left = 8, right = 8;
    const max = Math.max(settings.goal * 1.2, ...rows.map((r) => r.kcal));
    const y = (v) => top + (H - top - bottom) * (1 - v / max);
    const step = (W - left - right) / 7;
    const bw = Math.min(28, step * 0.55);
    const base = y(0);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近7日の摂取カロリー">`;
    svg += `<line class="grid" x1="${left}" x2="${W - right}" y1="${base}" y2="${base}"></line>`;
    svg += `<line class="goal-line" x1="${left}" x2="${W - right}" y1="${y(settings.goal)}" y2="${y(settings.goal)}"></line>`;
    svg += `<text x="${W - right}" y="${y(settings.goal) - 4}" text-anchor="end">目標 ${fmt(settings.goal)}</text>`;
    rows.forEach((r, i) => {
      const cx = left + step * i + step / 2;
      const h = Math.max(0, base - y(r.kcal));
      const over = r.kcal > settings.goal;
      const rad = Math.min(4, h / 2, bw / 2);
      const x0 = cx - bw / 2, y0 = base - h;
      // 上の角だけ丸め、下は基準線に揃える
      const path = h > 0
        ? `M${x0},${base} V${y0 + rad} Q${x0},${y0} ${x0 + rad},${y0} H${x0 + bw - rad} Q${x0 + bw},${y0} ${x0 + bw},${y0 + rad} V${base} Z`
        : '';
      const pd = parseYmd(r.d);
      svg += `<g><rect class="bar-hit" data-day="${r.d}" tabindex="0" x="${cx - step / 2}" y="${top}" width="${step}" height="${H - top}"><title>${dayText(r.d)} ${fmt(r.kcal)} kcal</title></rect>`;
      if (path) svg += `<path class="bar${over ? ' is-over' : ''}" d="${path}"></path>`;
      svg += `</g>`;
      if (r.d === currentDay || i === 6) {
        if (r.kcal) svg += `<text class="val" x="${cx}" y="${y0 - 4}" text-anchor="middle">${fmt(r.kcal)}</text>`;
      }
      svg += `<text x="${cx}" y="${H - 14}" text-anchor="middle">${pd.getDate()}</text>`;
      svg += `<text x="${cx}" y="${H - 2}" text-anchor="middle">${WEEKDAYS[pd.getDay()]}</text>`;
    });
    svg += '</svg>';
    el.weekChart.innerHTML = svg;
    el.weekChart.querySelectorAll('.bar-hit').forEach((hit) => {
      const open = () => { currentDay = hit.dataset.day; renderDay(); showView('day'); };
      hit.addEventListener('click', open);
      hit.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });

    el.weekTable.tBodies[0].innerHTML = rows.slice().reverse().map((r) => `
      <tr>
        <td>${dayText(r.d)}</td>
        <td class="${r.kcal > settings.goal ? 'is-over' : ''}">${r.n ? fmt(r.kcal) : '—'}</td>
        <td>${r.n ? round(r.p) : '—'}</td><td>${r.n ? round(r.f) : '—'}</td><td>${r.n ? round(r.c) : '—'}</td>
        <td>${r.n}</td>
      </tr>`).join('');
  }

  /* ---------- 設定 ---------- */
  function calcGoal() {
    const p = {
      sex: el.pSex.value, age: num(el.pAge.value), height: num(el.pHeight.value), weight: num(el.pWeight.value),
      activity: parseFloat(el.pActivity.value) || 1.75, plan: parseFloat(el.pPlan.value) || 0,
    };
    settings.profile = p;
    if (!p.age || !p.height || !p.weight) { el.calcOut.textContent = '年齢・身長・体重を入れると目安が出ます'; return 0; }
    // Mifflin-St Jeor 式で基礎代謝を出し、活動量を掛ける
    const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'male' ? 5 : -161);
    const goal = Math.max(1200, Math.round((bmr * p.activity + p.plan) / 10) * 10);
    el.calcOut.innerHTML = `基礎代謝 約${fmt(bmr)} kcal → 目安 <strong>${fmt(goal)}</strong> kcal/日`;
    return goal;
  }
  function renderSettings() {
    el.goalInput.value = settings.goal;
    const p = settings.profile || {};
    if (p.sex) el.pSex.value = p.sex;
    if (p.age) el.pAge.value = p.age;
    if (p.height) el.pHeight.value = p.height;
    if (p.weight) el.pWeight.value = p.weight;
    if (p.activity) el.pActivity.value = String(p.activity);
    if (p.plan !== undefined) el.pPlan.value = String(p.plan);
    calcGoal();
    el.apiKey.value = readText(API_KEY_KEY);
    renderEngine();
    const photos = meals.filter((m) => m.photo).length;
    el.dataState.textContent = `記録 ${meals.length}件（写真付き ${photos}件）。${cloud.db ? 'claude.ai のあなた専用の領域に保存しています。' : 'この端末のブラウザに保存しています。ときどきバックアップしてください。'}`;
  }
  function saveSettings() {
    writeJSON(SETTINGS_KEY, settings);
    pushSettings();
  }

  /* ---------- 書き出し・読み込み ---------- */
  async function exportData() {
    const text = JSON.stringify({ app: 'calorie-note', version: 1, settings: { goal: settings.goal, profile: settings.profile }, meals }, null, 2);
    const filename = `calorie-note-${today()}.json`;
    const saver = window.claude && typeof window.claude.use === 'function'
      ? await window.claude.use('downloads').catch(() => null)
      : null;
    if (saver) {
      try { await saver.save({ filename, data: text }); toast('書き出しました'); } catch (e) { toast('書き出しをやめました'); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importData(file) {
    try {
      const data = JSON.parse(await file.text());
      const incoming = (Array.isArray(data) ? data : data.meals || []).map(normalizeMeal).filter(Boolean);
      const ids = new Set(meals.map((m) => m.id));
      let added = 0;
      for (const m of incoming) {
        if (ids.has(m.id)) continue;
        meals.push(m);
        added += 1;
        pushMeal(m);
      }
      if (data.settings && data.settings.goal) {
        settings.goal = Math.round(num(data.settings.goal)) || settings.goal;
        settings.profile = data.settings.profile || settings.profile;
        saveSettings();
      }
      persist();
      renderAll();
      toast(`${added}件を読み込みました`);
    } catch (e) {
      toast('読み込めませんでした。書き出したバックアップ（.json）を選んでください');
    }
  }

  /* ---------- 画面の切り替え ---------- */
  function showView(name) {
    el.tabs.forEach((t) => {
      const on = t.dataset.view === name;
      t.classList.toggle('is-active', on);
      t.setAttribute('aria-selected', String(on));
    });
    el.views.forEach((v) => v.classList.toggle('is-active', v.id === `view-${name}`));
    if (name === 'week') renderWeek();
    if (name === 'settings') renderSettings();
    if (name === 'day') renderDay();
    window.scrollTo(0, 0);
  }
  function renderAll() { renderDay(); renderWeek(); renderSettings(); }

  /* ---------- イベント ---------- */
  el.tabs.forEach((t) => t.addEventListener('click', () => showView(t.dataset.view)));
  el.prevDay.addEventListener('click', () => { currentDay = addDays(currentDay, -1); renderDay(); });
  el.nextDay.addEventListener('click', () => { if (currentDay < today()) { currentDay = addDays(currentDay, 1); renderDay(); } });
  el.todayBtn.addEventListener('click', () => { currentDay = today(); renderDay(); });
  el.dayInput.addEventListener('change', () => { if (el.dayInput.value) { currentDay = el.dayInput.value; renderDay(); } });

  [el.cameraInput, el.libraryInput].forEach((input) => input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.value = '';
    onPhoto(file);
  }));
  el.manualBtn.addEventListener('click', startManual);
  el.mealType.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-type]');
    if (!b || !draft) return;
    draft.type = b.dataset.type;
    renderType();
  });
  el.addItem.addEventListener('click', () => {
    draft.items.push({ name: '', amount: '', kcal: 0, p: 0, f: 0, c: 0 });
    renderItems();
    const inputs = el.items.querySelectorAll('.item:last-child input');
    if (inputs[0]) inputs[0].focus();
  });
  el.reanalyzeBtn.addEventListener('click', runAnalysis);
  el.hintInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runAnalysis(); } });
  el.stopBtn.addEventListener('click', () => { if (analyzing) analyzing.abort(); });
  el.cancelBtn.addEventListener('click', closeEditor);
  el.saveBtn.addEventListener('click', saveDraft);
  el.deleteBtn.addEventListener('click', deleteDraft);

  el.goalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const g = Math.round(num(el.goalInput.value));
    if (g < 800 || g > 6000) { toast('目標は 800〜6000 kcal の範囲で入れてください'); return; }
    settings.goal = g;
    calcGoal();
    saveSettings();
    renderDay();
    toast('目標を保存しました');
  });
  [el.pSex, el.pAge, el.pHeight, el.pWeight, el.pActivity, el.pPlan].forEach((i) => i.addEventListener('input', calcGoal));
  el.applyCalc.addEventListener('click', () => {
    const g = calcGoal();
    if (!g) return;
    settings.goal = g;
    el.goalInput.value = g;
    saveSettings();
    renderDay();
    toast(`目標を ${fmt(g)} kcal にしました`);
  });
  el.keyForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const key = el.apiKey.value.trim();
    if (key && !key.startsWith('sk-ant-')) { toast('API キーは「sk-ant-」で始まる文字列です'); return; }
    writeText(API_KEY_KEY, key);
    renderEngine();
    toast(key ? 'キーを保存しました' : 'キーを消しました');
  });
  el.clearKey.addEventListener('click', () => {
    writeText(API_KEY_KEY, '');
    el.apiKey.value = '';
    renderEngine();
    toast('キーを消しました');
  });
  el.exportBtn.addEventListener('click', exportData);
  el.importInput.addEventListener('change', () => {
    const file = el.importInput.files && el.importInput.files[0];
    el.importInput.value = '';
    if (file) importData(file);
  });

  // 日付をまたいで開きっぱなしでも「今日」がずれないように
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') renderDay();
  });

  renderAll();
  detectSample();
  connectCloud();
})();
</script>
</body>
</html>
