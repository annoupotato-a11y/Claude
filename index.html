<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="言語化ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee">
<title>言語化ノート</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.webmanifest" data-pwa>
<link rel="apple-touch-icon" href="assets/icon-180.png" data-pwa>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
</head>
<body>
<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title">言語化ノート<span class="app-title__sub">毎日の思考を言葉にする</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="write" aria-selected="true">書く</button>
      <button class="tab" role="tab" data-view="list" aria-selected="false">ノート一覧<span class="tab__count" id="tabCount">0</span></button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 書く ============ -->
  <section id="view-write" class="view is-active">
    <div class="toolbar no-print">
      <label class="field-date">
        <span>日付</span>
        <input type="date" id="entryDate">
      </label>
      <div class="toolbar__spacer"></div>
      <span class="streak" id="streak"></span>
      <span class="sync" id="sync" hidden></span>
    </div>

    <input type="text" id="entryTitle" class="spread-title" placeholder="今回の事例のタイトル（任意）">

    <!-- 見開きノート -->
    <div class="spread">
      <!-- 左ページ：問い＋理由 -->
      <div class="page page--left">
        <div class="boxed boxed--question">
          <textarea id="fWhat" class="question" rows="1" placeholder="プレゼン終了。テンション上がった。"></textarea>
          <span class="question__suffix">のはなぜか？</span>
        </div>

        <div class="list-block" data-list="why">
          <div class="block__label">
            <span>理由<span class="en">（WHY）</span></span>
            <button type="button" class="mark-btn" data-mark="whyLines" title="選択した言葉にマーカー（Ctrl / ⌘ + M）">マーカー</button>
          </div>
          <ul class="lines" id="whyLines"></ul>
          <button type="button" class="add-line" data-add="whyLines">＋ 理由を追加</button>
        </div>
      </div>

      <!-- 右ページ：結論＋行動 -->
      <div class="page page--right">
        <div class="boxed">
          <span class="chip">結論</span>
          <textarea id="fConclusion" class="conclusion" rows="2" placeholder="◯◯なのは、△△だから"></textarea>
        </div>

        <div class="boxed list-block" data-list="action">
          <span class="chip chip--filled"><input type="text" id="actionLabel" class="chip__input" value="行動" maxlength="8" aria-label="欄の見出し（自由にアレンジ）"></span>
          <ul class="lines" id="actionLines"></ul>
          <div class="list-block__foot">
            <button type="button" class="add-line" data-add="actionLines">＋ 行動を追加</button>
            <button type="button" class="mark-btn" data-mark="actionLines" title="選択した言葉にマーカー（Ctrl / ⌘ + M）">マーカー</button>
          </div>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="btn btn--primary" id="saveBtn" type="button">保存する</button>
      <button class="btn" id="newBtn" type="button">新規</button>
      <button class="btn btn--small" id="printBtn" type="button">印刷 / PDF</button>
      <button class="btn btn--ghost" id="deleteBtn" type="button" hidden>削除</button>
      <span class="hint">Enterで次の行 ／ 文字を選んで ⌘・Ctrl + M でマーカー ／ ⌘・Ctrl + S で保存</span>
    </div>
  </section>

  <!-- ============ 一覧 ============ -->
  <section id="view-list" class="view">
    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="キーワードで検索（本文・日付）">
      <div class="toolbar__spacer"></div>
      <div class="menu">
        <button class="btn btn--small" id="exportMdBtn" type="button">Markdown書き出し</button>
        <button class="btn btn--small" id="exportBtn" type="button">バックアップ</button>
        <label class="btn btn--small" for="importInput">読み込み</label>
        <input type="file" id="importInput" accept="application/json" hidden>
      </div>
    </div>
    <div id="entryList" class="entry-list"></div>
  </section>
</main>

<button type="button" id="markFloat" class="mark-float">選んだ言葉にマーカー</button>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/app.js"></script>
<script data-pwa>
  // ホーム画面から開いたときもオフラインで動くようにする（https配信時のみ）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
