<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="言語化ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee">
<title>言語化ノート</title>
<style>
/* ===== 言語化ノート : 手書きの見開きノートを思わせるUI ===== */
:root {
  --paper:      #fbf9f4;
  --paper-edge: #f1ece1;
  --ink:        #23201b;
  --ink-soft:   #6d665a;
  --line:       #ddd5c6;
  --accent:     #2f6f5e;
  --accent-ink: #ffffff;
  --band:       #e6e1d6;
  --marker:     #cfe3c8;
  --danger:     #a4402f;
  --radius:     10px;
  --shadow:     0 1px 2px rgba(35,32,27,.06), 0 10px 30px rgba(35,32,27,.08);
}
/* 端末の設定が暗いとき（明るいテーマを選んでいる人は除く） */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #1c1b19;
    --paper-edge: #131211;
    --ink:        #ece7dd;
    --ink-soft:   #9c948a;
    --line:       #3a372f;
    --accent:     #6fb59d;
    --accent-ink: #10201b;
    --band:       #2f2c26;
    --marker:     #37564b;
    --danger:     #e0836f;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
/* 明るい／暗いを自分で選んでいるとき */
:root[data-theme="dark"] {
  --paper:    #1c1b19;
  --paper-edge: #131211;
  --ink:    #ece7dd;
  --ink-soft:   #9c948a;
  --line:     #3a372f;
  --accent:   #6fb59d;
  --accent-ink: #10201b;
  --band:     #2f2c26;
  --marker:   #37564b;
  --danger:   #e0836f;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper-edge);
  color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP",
               "Yu Gothic Medium", "Yu Gothic", Meiryo, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.7;
}
main { max-width: 940px; margin: 0 auto; padding: 20px 16px 96px; }

/* ---- header ---- */
.app-header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.app-header__inner {
  max-width: 940px; margin: 0 auto; padding: 12px 16px 0;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
}
.app-title { font-size: 1.15rem; margin: 0; letter-spacing: .04em; }
.app-title__sub {
  display: block; font-size: .72rem; font-weight: 400;
  color: var(--ink-soft); letter-spacing: .08em; margin-top: 2px;
}
.tabs { margin-left: auto; display: flex; gap: 4px; align-self: flex-end; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: .9rem; color: var(--ink-soft);
  padding: 10px 12px; border-bottom: 2px solid transparent;
}
.tab.is-active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab__count {
  display: inline-block; margin-left: 6px; padding: 0 7px;
  border-radius: 99px; background: var(--band); font-size: .72rem; line-height: 1.6;
}

/* ---- views / toolbar ---- */
.view { display: none; animation: fade .18s ease; }
.view.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar__spacer { flex: 1; }
.field-date { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--ink-soft); }
input[type="date"], .search {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px;
}
.search { flex: 1 1 240px; min-width: 0; }
.streak { font-size: .8rem; color: var(--ink-soft); }
.sync { font-size: .74rem; color: var(--accent); white-space: nowrap; }

/* ---- 見開きの上のタイトル ---- */
.spread-title {
  display: block; width: 100%; margin: 0 auto 12px; padding: 4px;
  font: inherit; font-size: 1.05rem; font-weight: 700; text-align: center;
  color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed transparent;
}
.spread-title:focus { outline: none; border-bottom-color: var(--line); }
.spread-title::placeholder { color: color-mix(in srgb, var(--ink-soft) 60%, transparent); font-weight: 400; }

/* ---- 見開きノート ---- */
.spread {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  background: var(--paper); border: 3px solid var(--ink);
  border-radius: 18px 18px 8px 8px; padding: 10px; box-shadow: var(--shadow);
}
.page {
  border: 1px solid var(--ink); border-radius: 10px; padding: 14px;
  display: grid; gap: 14px; align-content: start; min-width: 0;
}

/* 枠つきブロック（問い・結論・行動） */
.boxed { border: 1.5px solid var(--ink); border-radius: 6px; padding: 10px 12px; }
.boxed--question { display: grid; gap: 2px; }
.chip {
  display: inline-block; border: 1.5px solid var(--ink); border-radius: 4px;
  background: var(--band); padding: 1px 10px; font-size: .84rem; font-weight: 700;
  letter-spacing: .08em; margin-bottom: 6px;
}
.chip--filled { padding: 1px 6px; }
.list-block > .chip { justify-self: start; }
.chip__input {
  font: inherit; font-weight: 700; letter-spacing: .08em; color: var(--ink);
  background: transparent; border: 0; padding: 0 2px; width: 4.6em; text-align: center;
}
.chip__input:focus { outline: 1px dashed var(--accent); outline-offset: 2px; }

/* 見出し（理由） */
.block__label {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-weight: 700; font-size: .9rem; letter-spacing: .06em;
}
.block__label .en { font-size: .72rem; font-weight: 400; color: var(--ink-soft); letter-spacing: .02em; }

/* ---- 入力欄 ---- */
textarea {
  font: inherit; color: var(--ink); background: transparent;
  border: 0; padding: 2px; resize: none; width: 100%; line-height: 1.85; overflow: hidden;
}
textarea:focus { outline: none; }
textarea::placeholder, .line__text:empty::before { color: color-mix(in srgb, var(--ink-soft) 60%, transparent); }
.question { font-weight: 700; min-height: 2.2em; }
.question__suffix { display: block; text-align: right; font-weight: 700; font-size: .9rem; }
.conclusion { font-weight: 700; min-height: 3.4em; }

/* ---- 箇条書き（理由・行動） ---- */
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.line { display: grid; grid-template-columns: 1em 1fr auto; align-items: start; gap: 2px; }
.line__bullet { color: var(--ink); line-height: 1.85; user-select: none; }
.line__text {
  line-height: 1.85; padding: 1px 2px; min-height: 1.85em; word-break: break-word;
  border-bottom: 1px dashed transparent; outline: none;
}
.line__text:focus { border-bottom-color: var(--line); }
.line__text:empty::before { content: attr(data-placeholder); }
.line__del {
  appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
  color: var(--ink-soft); opacity: 0; padding: 0 4px; line-height: 1.85;
}
.line:hover .line__del, .line:focus-within .line__del { opacity: .7; }
.line__del:hover { opacity: 1; color: var(--danger); }

mark {
  background: linear-gradient(transparent 58%, var(--marker) 58%);
  color: inherit; border-radius: 2px; padding: 0 1px;
}

.list-block { display: grid; gap: 6px; align-content: start; }
.list-block__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.add-line {
  appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
  font-size: .8rem; color: var(--ink-soft); padding: 2px 0; justify-self: start;
}
.add-line:hover { color: var(--accent); }
.mark-btn {
  appearance: none; cursor: pointer; font: inherit; font-size: .74rem;
  color: var(--ink-soft); background: var(--band); border: 1px solid var(--line);
  border-radius: 99px; padding: 1px 10px; white-space: nowrap;
}
.mark-btn:hover { color: var(--ink); border-color: var(--accent); }

/* ---- 選択中に浮かぶマーカーボタン ---- */
.mark-float {
  position: fixed; left: 50%; bottom: 26px; z-index: 30;
  transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 99px; padding: 12px 24px;
  box-shadow: 0 6px 20px rgba(35,32,27,.28);
  transition: opacity .15s ease, transform .15s ease;
}
.mark-float.is-shown { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

/* ---- actions ---- */
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  font: inherit; font-size: .9rem; cursor: pointer;
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 9px 18px; transition: transform .06s ease, background .15s ease;
}
.btn:hover { background: var(--band); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
.btn--ghost { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn--small { padding: 6px 12px; font-size: .8rem; }
.menu { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-size: .74rem; color: var(--ink-soft); }

/* ---- 一覧 ---- */
.entry-list { display: grid; gap: 12px; }
.entry {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  cursor: pointer;
}
.entry:hover { border-color: var(--accent); }
.entry__date { font-size: .76rem; color: var(--ink-soft); letter-spacing: .08em; }
.entry__title { font-size: .78rem; color: var(--accent); margin-left: 8px; }
.entry__what { font-weight: 700; margin: 4px 0 0; }
.entry__conclusion {
  margin: 8px 0 0; padding-left: 10px; border-left: 3px solid var(--band);
  font-size: .9rem; color: var(--ink-soft); white-space: pre-wrap;
}
.entry__meta { margin: 8px 0 0; font-size: .74rem; color: var(--ink-soft); }
.empty { text-align: center; color: var(--ink-soft); padding: 48px 12px; font-size: .9rem; }

/* ---- toast ---- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
  background: var(--ink); color: var(--paper); padding: 10px 20px;
  border-radius: 99px; font-size: .85rem; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; z-index: 20;
}
.toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

/* ---- 狭い画面（スマホ）：見開きを上下に、操作は下端に固定 ---- */
@media (max-width: 700px) {
  main { padding: 16px 12px 108px; }
  .spread { grid-template-columns: 1fr; }
  .app-title__sub { display: none; }
  .app-title { font-size: 1rem; }
  .page { padding: 12px; }
  .toolbar { gap: 8px; }

  /* 指で押せる大きさに */
  .btn { padding: 12px 16px; }
  .btn--small { padding: 9px 14px; }
  .add-line { padding: 8px 0; font-size: .86rem; }
  .line__del { opacity: .45; padding: 4px 6px; min-width: 32px; }
  .mark-btn { padding: 6px 14px; }

  /* 保存バーを画面下に固定する */
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; margin: 0;
    gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--paper); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 18px rgba(35,32,27,.10);
  }
  .actions .hint { display: none; }
  .actions .btn--primary { flex: 1; }
  .mark-float { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

  #view-list { padding-bottom: 8px; }
}

/* ---- 印刷 ---- */
@media print {
  body { background: #fff; }
  .app-header, .no-print, #view-list { display: none !important; }
  main { padding: 0; max-width: none; }
  .spread { grid-template-columns: 1fr 1fr; box-shadow: none; break-inside: avoid; }
  .add-line, .mark-btn, .line__del { display: none !important; }
  mark { background: linear-gradient(transparent 58%, #d8d8d8 58%); }
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
</head>
<body>
<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title">言語化ノート<span class="app-title__sub">毎日の思考を言葉にする</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="write" aria-selected="true">書く</button>
      <button class="tab" role="tab" data-view="list" aria-selected="false">ノート一覧<span class="tab__count" id="tabCount">0</span></button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 書く ============ -->
  <section id="view-write" class="view is-active">
    <div class="toolbar no-print">
      <label class="field-date">
        <span>日付</span>
        <input type="date" id="entryDate">
      </label>
      <div class="toolbar__spacer"></div>
      <span class="streak" id="streak"></span>
      <span class="sync" id="sync" hidden></span>
    </div>

    <input type="text" id="entryTitle" class="spread-title" placeholder="今回の事例のタイトル（任意）">

    <!-- 見開きノート -->
    <div class="spread">
      <!-- 左ページ：問い＋理由 -->
      <div class="page page--left">
        <div class="boxed boxed--question">
          <textarea id="fWhat" class="question" rows="1" placeholder="プレゼン終了。テンション上がった。"></textarea>
          <span class="question__suffix">のはなぜか？</span>
        </div>

        <div class="list-block" data-list="why">
          <div class="block__label">
            <span>理由<span class="en">（WHY）</span></span>
            <button type="button" class="mark-btn" data-mark="whyLines" title="選択した言葉にマーカー（Ctrl / ⌘ + M）">マーカー</button>
          </div>
          <ul class="lines" id="whyLines"></ul>
          <button type="button" class="add-line" data-add="whyLines">＋ 理由を追加</button>
        </div>
      </div>

      <!-- 右ページ：結論＋行動 -->
      <div class="page page--right">
        <div class="boxed">
          <span class="chip">結論</span>
          <textarea id="fConclusion" class="conclusion" rows="2" placeholder="◯◯なのは、△△だから"></textarea>
        </div>

        <div class="boxed list-block" data-list="action">
          <span class="chip chip--filled"><input type="text" id="actionLabel" class="chip__input" value="行動" maxlength="8" aria-label="欄の見出し（自由にアレンジ）"></span>
          <ul class="lines" id="actionLines"></ul>
          <div class="list-block__foot">
            <button type="button" class="add-line" data-add="actionLines">＋ 行動を追加</button>
            <button type="button" class="mark-btn" data-mark="actionLines" title="選択した言葉にマーカー（Ctrl / ⌘ + M）">マーカー</button>
          </div>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="btn btn--primary" id="saveBtn" type="button">保存する</button>
      <button class="btn" id="newBtn" type="button">新規</button>
      <button class="btn btn--small" id="printBtn" type="button">印刷 / PDF</button>
      <button class="btn btn--ghost" id="deleteBtn" type="button" hidden>削除</button>
      <span class="hint">Enterで次の行 ／ 文字を選んで ⌘・Ctrl + M でマーカー ／ ⌘・Ctrl + S で保存</span>
    </div>
  </section>

  <!-- ============ 一覧 ============ -->
  <section id="view-list" class="view">
    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="キーワードで検索（本文・日付）">
      <div class="toolbar__spacer"></div>
      <div class="menu">
        <button class="btn btn--small" id="exportMdBtn" type="button">Markdown書き出し</button>
        <button class="btn btn--small" id="exportBtn" type="button">バックアップ</button>
        <label class="btn btn--small" for="importInput">読み込み</label>
        <input type="file" id="importInput" accept="application/json" hidden>
      </div>
    </div>
    <div id="entryList" class="entry-list"></div>
  </section>
</main>

<button type="button" id="markFloat" class="mark-float">選んだ言葉にマーカー</button>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 言語化ノート =====
 * 書籍『言語化ノート術』の見開きフォーマットを写したノートアプリ。
 * 左ページ = 問い（メモ WHAT ＋のはなぜか？）と理由（WHY）の箇条書き、
 * 右ページ = 結論と行動（見出しは自由にアレンジ可）。
 * データはブラウザの localStorage にのみ保存する（サーバー送信なし）。
 *
 * entry = {
 *   id, date:'YYYY-MM-DD', title, what, conclusion, actionLabel,
 *   why: [line], action: [line], createdAt, updatedAt
 * }
 * line  = { text:'…', marks:[[start,end], …] }   marks = マーカーを引いた範囲
 */
(() => {
  'use strict';

  const STORE_KEY = 'gengoka-note/entries/v2';
  const LEGACY_KEY = 'gengoka-note/entries/v1';
  const DRAFT_KEY = 'gengoka-note/draft/v2';

  const $ = (id) => document.getElementById(id);
  const el = {
    date: $('entryDate'),
    title: $('entryTitle'),
    what: $('fWhat'),
    conclusion: $('fConclusion'),
    actionLabel: $('actionLabel'),
    whyLines: $('whyLines'),
    actionLines: $('actionLines'),
    saveBtn: $('saveBtn'),
    deleteBtn: $('deleteBtn'),
    list: $('entryList'),
    search: $('search'),
    tabCount: $('tabCount'),
    streak: $('streak'),
    sync: $('sync'),
    markFloat: $('markFloat'),
    toast: $('toast'),
  };
  const PLACEHOLDER = {
    whyLines: '思いついた理由をひとつずつ',
    actionLines: '明日からやること',
  };

  let entries = load();
  let editingId = null;

  /* =========================================================
   * line（テキスト＋マーカー範囲）の操作
   * =======================================================*/
  function normalizeMarks(marks, length) {
    return (Array.isArray(marks) ? marks : [])
      .map(([s, e]) => [Math.max(0, Math.min(s | 0, length)), Math.max(0, Math.min(e | 0, length))])
      .filter(([s, e]) => e > s)
      .sort((a, b) => a[0] - b[0])
      .reduce((acc, range) => {
        const last = acc[acc.length - 1];
        if (last && range[0] <= last[1]) last[1] = Math.max(last[1], range[1]);
        else acc.push(range);
        return acc;
      }, []);
  }

  function makeLine(text = '', marks = []) {
    const value = String(text);
    return { text: value, marks: normalizeMarks(marks, value.length) };
  }

  /** contenteditable の中身を line に変換する（<mark> だけを意味のある要素として読む） */
  function lineFromDom(node) {
    let text = '';
    const marks = [];
    (function walk(parent) {
      parent.childNodes.forEach((child) => {
        if (child.nodeType === Node.TEXT_NODE) {
          text += child.nodeValue;
        } else if (child.nodeName === 'MARK') {
          const start = text.length;
          text += child.textContent;
          marks.push([start, text.length]);
        } else if (child.nodeName === 'BR') {
          text += ' ';
        } else {
          walk(child);
        }
      });
    })(node);
    return makeLine(text, marks);
  }

  /** line を contenteditable に描き直す */
  function lineToDom(node, line) {
    const { text, marks } = makeLine(line.text, line.marks);
    node.textContent = '';
    let pos = 0;
    marks.forEach(([start, end]) => {
      if (start > pos) node.append(text.slice(pos, start));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(start, end);
      node.append(mark);
      pos = end;
    });
    if (pos < text.length) node.append(text.slice(pos));
  }

  /** 文字列としてのオフセットに変換する（マーカーをまたいでも正しく数える） */
  function offsetOf(root, node, offset) {
    const range = document.createRange();
    range.selectNodeContents(root);
    range.setEnd(node, offset);
    return range.toString().length;
  }

  function setCaret(root, offset) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let seen = 0;
    let node;
    const range = document.createRange();
    while ((node = walker.nextNode())) {
      const len = node.nodeValue.length;
      if (seen + len >= offset) {
        range.setStart(node, offset - seen);
        range.collapse(true);
        break;
      }
      seen += len;
      node = null;
    }
    if (!node) {
      range.selectNodeContents(root);
      range.collapse(false);
    }
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    root.focus({ preventScroll: true });
  }

  function sliceLine(line, from, to) {
    const marks = line.marks
      .map(([s, e]) => [Math.max(s, from) - from, Math.min(e, to) - from])
      .filter(([s, e]) => e > s);
    return makeLine(line.text.slice(from, to), marks);
  }

  function concatLines(a, b) {
    const shift = a.text.length;
    return makeLine(a.text + b.text, [...a.marks, ...b.marks.map(([s, e]) => [s + shift, e + shift])]);
  }

  /* =========================================================
   * 行（li）の組み立て
   * =======================================================*/
  function createRow(listEl, line) {
    const li = document.createElement('li');
    li.className = 'line';

    const bullet = document.createElement('span');
    bullet.className = 'line__bullet';
    bullet.textContent = '・';

    const text = document.createElement('div');
    text.className = 'line__text';
    text.contentEditable = 'true';
    text.dataset.placeholder = PLACEHOLDER[listEl.id] || '';
    lineToDom(text, makeLine(line && line.text, line && line.marks));

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'line__del';
    del.title = 'この行を削除';
    del.textContent = '×';
    del.addEventListener('click', () => {
      const prev = li.previousElementSibling;
      li.remove();
      if (!listEl.children.length) addRow(listEl);
      else if (prev) focusEnd(prev.querySelector('.line__text'));
      saveDraft();
    });

    text.addEventListener('input', saveDraft);
    text.addEventListener('paste', (ev) => {
      ev.preventDefault();
      const plain = (ev.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
      document.execCommand('insertText', false, plain);
    });
    text.addEventListener('keydown', (ev) => onRowKeydown(ev, listEl, li, text));

    li.append(bullet, text, del);
    return li;
  }

  function addRow(listEl, line, after) {
    const li = createRow(listEl, line);
    if (after) after.after(li);
    else listEl.append(li);
    return li;
  }

  function focusEnd(node) {
    if (!node) return;
    setCaret(node, lineFromDom(node).text.length);
  }

  function onRowKeydown(ev, listEl, li, text) {
    if (ev.isComposing || ev.keyCode === 229) return; // IMEの変換中は横取りしない
    if (ev.key === 'Enter') {
      ev.preventDefault();
      const line = lineFromDom(text);
      const caret = currentOffset(text);
      lineToDom(text, sliceLine(line, 0, caret));
      const next = addRow(listEl, sliceLine(line, caret, line.text.length), li);
      setCaret(next.querySelector('.line__text'), 0);
      saveDraft();
      return;
    }
    if (ev.key === 'Backspace' && currentOffset(text) === 0 && window.getSelection().isCollapsed) {
      const prev = li.previousElementSibling;
      if (!prev) return;
      ev.preventDefault();
      const prevText = prev.querySelector('.line__text');
      const head = lineFromDom(prevText);
      lineToDom(prevText, concatLines(head, lineFromDom(text)));
      li.remove();
      setCaret(prevText, head.text.length);
      saveDraft();
    }
  }

  function currentOffset(root) {
    const selection = window.getSelection();
    if (!selection.rangeCount || !root.contains(selection.anchorNode)) return 0;
    const range = selection.getRangeAt(0);
    return offsetOf(root, range.startContainer, range.startOffset);
  }

  /* =========================================================
   * マーカー
   * =======================================================*/
  /** いま選択されている範囲が理由・行動の一行の中にあれば、その行を返す */
  function selectedLine() {
    const selection = window.getSelection();
    if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
    const range = selection.getRangeAt(0);
    const anchor = range.startContainer;
    const base = anchor.nodeType === Node.ELEMENT_NODE ? anchor : anchor.parentElement;
    const root = base && base.closest('.line__text');
    return root && root.contains(range.endContainer) ? { root, range } : null;
  }

  function toggleMark() {
    const target = selectedLine();
    if (!target) return toast('理由・行動の文字を選んでからマーカーを押してください');
    const { root, range } = target;

    const from = offsetOf(root, range.startContainer, range.startOffset);
    const to = offsetOf(root, range.endContainer, range.endOffset);
    const line = lineFromDom(root);
    const covered = line.marks.some(([s, e]) => s <= from && e >= to);
    const marks = covered
      ? line.marks.flatMap(([s, e]) => [[s, Math.min(e, from)], [Math.max(s, to), e]])
      : [...line.marks, [from, to]];

    lineToDom(root, makeLine(line.text, marks));
    setCaret(root, to);
    updateMarkFloat();
    saveDraft();
  }

  function updateMarkFloat() {
    el.markFloat.classList.toggle('is-shown', !!selectedLine());
  }

  /* =========================================================
   * 保存領域
   * =======================================================*/
  function toLine(raw) {
    if (typeof raw === 'string') return makeLine(raw);
    return makeLine(raw && raw.text, raw && raw.marks);
  }

  function toLines(raw) {
    if (Array.isArray(raw)) return raw.map(toLine).filter((l) => l.text.trim());
    return String(raw || '')
      .split('\n')
      .map((t) => t.replace(/^[\s・\-*•]+/, '').trim())
      .filter(Boolean)
      .map((t) => makeLine(t));
  }

  function normalizeEntry(raw) {
    if (!raw || typeof raw !== 'object' || !raw.date) return null;
    const now = new Date().toISOString();
    return {
      id: raw.id || uid(),
      date: String(raw.date).slice(0, 10),
      title: String(raw.title || ''),
      what: String(raw.what || ''),
      why: toLines(raw.why),
      conclusion: String(raw.conclusion || ''),
      actionLabel: String(raw.actionLabel || '行動'),
      action: toLines(raw.action !== undefined ? raw.action : raw.memo), // v1 の「メモ欄」を引き継ぐ
      createdAt: raw.createdAt || now,
      updatedAt: raw.updatedAt || now,
    };
  }

  function load() {
    const read = (key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        const list = Array.isArray(parsed) ? parsed : parsed && parsed.entries;
        return Array.isArray(list) ? list : [];
      } catch (e) {
        console.error('保存データを読めませんでした', e);
        return [];
      }
    };
    const stored = read(STORE_KEY);
    if (stored.length) return stored.map(normalizeEntry).filter(Boolean);
    const legacy = read(LEGACY_KEY).map(normalizeEntry).filter(Boolean); // 旧フォーマットからの引っ越し
    if (legacy.length) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(legacy)); } catch (e) { /* 失敗しても表示はできる */ }
    }
    return legacy;
  }

  /* ---------- クラウド保存（使えるときだけ）---------- */
  const cloud = { db: null, unwatch: null };

  const toDoc = (entry) => {
    const { id, ...rest } = entry;
    return rest;
  };

  function setSync(text) {
    el.sync.textContent = text;
    el.sync.hidden = !text;
  }

  async function connectCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    let api = null;
    try { api = await window.claude.use('db'); } catch (e) { api = null; }
    if (!api) return;
    cloud.db = api;
    try {
      const snapshot = await api.collection('entries').get();
      const remote = snapshot.docs
        .map((doc) => normalizeEntry(Object.assign({ id: doc.id }, doc.data())))
        .filter(Boolean);
      const remoteIds = new Set(remote.map((e) => e.id));
      const onlyHere = entries.filter((e) => !remoteIds.has(e.id));
      entries = remote.concat(onlyHere);
      persist();
      render();
      // この端末にしかないノートをクラウドへ引っ越す
      for (const entry of onlyHere) await pushCloud(entry);
      if (onlyHere.length) toast(`${onlyHere.length}件のノートをクラウドへ移しました`);
      watchCloud();
      setSync('☁ 同期中');
    } catch (e) {
      cloud.db = null;
      setSync('この端末に保存');
    }
  }

  function watchCloud() {
    if (!cloud.db) return;
    cloud.unwatch = cloud.db.collection('entries').onSnapshot((snapshot) => {
      // 一覧だけを更新する。書きかけのフォームには触れない
      entries = snapshot.docs
        .map((doc) => normalizeEntry(Object.assign({ id: doc.id }, doc.data())))
        .filter(Boolean);
      persist();
      render();
    }, () => setSync('この端末に保存'));
  }

  function pushCloud(entry) {
    if (!cloud.db || !entry) return Promise.resolve();
    return cloud.db.doc(`entries/${entry.id}`).set(toDoc(entry))
      .catch(() => toast('クラウドに保存できませんでした（この端末には保存済み）'));
  }

  function dropCloud(id) {
    if (!cloud.db) return Promise.resolve();
    return cloud.db.doc(`entries/${id}`).delete().catch(() => {});
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(entries));
      return true;
    } catch (e) {
      toast('保存できませんでした（保存領域の上限かもしれません）');
      return false;
    }
  }

  /* =========================================================
   * 小道具
   * =======================================================*/
  const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD（ローカル時刻）
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function formatDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const week = '日月火水木金土'[new Date(y, m - 1, d).getDay()];
    return `${y}年${m}月${d}日（${week}）`;
  }

  let toastTimer;
  function toast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('is-shown');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('is-shown'), 2400);
  }

  function autoGrow(node) {
    node.style.height = 'auto';
    node.style.height = `${node.scrollHeight}px`;
  }

  /* =========================================================
   * フォーム
   * =======================================================*/
  function readList(listEl) {
    return [...listEl.querySelectorAll('.line__text')]
      .map(lineFromDom)
      .filter((line) => line.text.trim());
  }

  function fillList(listEl, lines) {
    listEl.textContent = '';
    (lines && lines.length ? lines : [makeLine()]).forEach((line) => addRow(listEl, line));
  }

  function readForm() {
    return {
      date: el.date.value || today(),
      title: el.title.value.trim(),
      what: el.what.value.trim(),
      why: readList(el.whyLines),
      conclusion: el.conclusion.value.trim(),
      actionLabel: el.actionLabel.value.trim() || '行動',
      action: readList(el.actionLines),
    };
  }

  function fillForm(entry) {
    el.date.value = entry.date || today();
    el.title.value = entry.title || '';
    el.what.value = entry.what || '';
    el.conclusion.value = entry.conclusion || '';
    el.actionLabel.value = entry.actionLabel || '行動';
    fillList(el.whyLines, entry.why);
    fillList(el.actionLines, entry.action);
    [el.what, el.conclusion].forEach(autoGrow);
  }

  const isBlank = (data) =>
    !data.what && !data.conclusion && !data.title && !data.why.length && !data.action.length;

  function newEntry() {
    editingId = null;
    fillForm({ date: today() });
    el.deleteBtn.hidden = true;
    el.saveBtn.textContent = '保存する';
    localStorage.removeItem(DRAFT_KEY);
    el.what.focus();
  }

  function save() {
    const data = readForm();
    if (isBlank(data)) {
      toast('まだ何も書かれていません');
      el.what.focus();
      return;
    }
    const now = new Date().toISOString();
    const editing = editingId && entries.find((e) => e.id === editingId);
    if (editing) {
      Object.assign(editing, data, { updatedAt: now });
    } else if (editingId) {
      // 別の端末で消えていた場合は、同じIDで作り直す
      entries.push(Object.assign({ id: editingId, createdAt: now, updatedAt: now }, data));
    } else {
      const entry = Object.assign({ id: uid(), createdAt: now, updatedAt: now }, data);
      entries.push(entry);
      editingId = entry.id;
    }
    if (!persist()) return;
    pushCloud(entries.find((e) => e.id === editingId));
    localStorage.removeItem(DRAFT_KEY);
    el.deleteBtn.hidden = false;
    el.saveBtn.textContent = '更新する';
    render();
    toast('保存しました');
  }

  function edit(id) {
    const entry = entries.find((e) => e.id === id);
    if (!entry) return;
    editingId = id;
    fillForm(entry);
    el.deleteBtn.hidden = false;
    el.saveBtn.textContent = '更新する';
    showView('write');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function remove() {
    if (!editingId) return;
    if (!confirm('このノートを削除しますか？')) return;
    const removedId = editingId;
    entries = entries.filter((e) => e.id !== removedId);
    persist();
    dropCloud(removedId);
    newEntry();
    render();
    toast('削除しました');
  }

  /* ---------- 下書きの自動保存 ---------- */
  let draftTimer;
  function saveDraft() {
    if (editingId) return; // 既存ノートの編集中は下書きを持たない
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
      const data = readForm();
      if (isBlank(data)) { localStorage.removeItem(DRAFT_KEY); return; }
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) { /* 上限時は諦める */ }
    }, 300);
  }

  function restoreDraft() {
    try {
      const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (!draft) return false;
      fillForm(normalizeEntry(Object.assign({ date: today() }, draft)));
      return true;
    } catch (e) { return false; }
  }

  /* =========================================================
   * 一覧
   * =======================================================*/
  const plain = (entry) => [
    entry.date, entry.title, entry.what, entry.conclusion, entry.actionLabel,
    ...entry.why.map((l) => l.text), ...entry.action.map((l) => l.text),
  ].join('\n');

  function sorted() {
    return [...entries].sort((a, b) =>
      b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  }

  function render() {
    el.tabCount.textContent = entries.length;
    el.streak.textContent = streakLabel();

    const query = el.search.value.trim().toLowerCase();
    const shown = sorted().filter((e) => !query || plain(e).toLowerCase().includes(query));

    el.list.textContent = '';
    if (!shown.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = entries.length
        ? '該当するノートはありません'
        : 'まだノートがありません。「書く」から今日の一件を残しましょう。';
      el.list.append(p);
      return;
    }

    shown.forEach((entry) => {
      const card = document.createElement('article');
      card.className = 'entry';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');

      const head = document.createElement('div');
      head.className = 'entry__date';
      head.textContent = formatDate(entry.date);
      if (entry.title) {
        const title = document.createElement('span');
        title.className = 'entry__title';
        title.textContent = entry.title;
        head.append(title);
      }

      const what = document.createElement('p');
      what.className = 'entry__what';
      what.textContent = `${entry.what || '（メモなし）'}のはなぜか？`;

      card.append(head, what);

      if (entry.conclusion) {
        const conclusion = document.createElement('p');
        conclusion.className = 'entry__conclusion';
        conclusion.textContent = entry.conclusion;
        card.append(conclusion);
      }

      const meta = document.createElement('p');
      meta.className = 'entry__meta';
      meta.textContent = `理由 ${entry.why.length}件 ／ ${entry.actionLabel} ${entry.action.length}件`;
      card.append(meta);

      const open = () => edit(entry.id);
      card.addEventListener('click', open);
      card.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
      el.list.append(card);
    });
  }

  function streakLabel() {
    if (!entries.length) return '';
    const days = new Set(entries.map((e) => e.date));
    const cursor = new Date();
    // 今日まだ書いていなければ、昨日からの連続を数える
    if (!days.has(cursor.toLocaleDateString('sv-SE'))) cursor.setDate(cursor.getDate() - 1);
    let streak = 0;
    while (days.has(cursor.toLocaleDateString('sv-SE'))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak > 1 ? `${streak}日連続で記録中` : `これまで${days.size}日分`;
  }

  /* =========================================================
   * 書き出し / 読み込み
   * =======================================================*/
  async function download(filename, text, type) {
    // Artifactとして開いているときは、確認画面を出す公式の保存経路を使う
    const saver = window.claude && typeof window.claude.use === 'function'
      ? await window.claude.use('downloads').catch(() => null)
      : null;
    if (saver) {
      try {
        const result = await saver.save({ filename, data: text });
        if (result && result.status === 'saved') toast('書き出しました');
      } catch (err) {
        if (err && err.code === 'declined') return;         // 閲覧者が保存をやめた
        toast('書き出せませんでした');
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: `${type};charset=utf-8` }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportJson() {
    if (!entries.length) return toast('書き出すノートがありません');
    download(`言語化ノート_${today()}.json`,
      JSON.stringify({ app: 'gengoka-note', version: 2, entries }, null, 2), 'application/json');
  }

  /** マーカー部分は Markdown の ==強調== として書き出す */
  const lineToMd = (line) => {
    let out = '';
    let pos = 0;
    line.marks.forEach(([s, e]) => {
      out += `${line.text.slice(pos, s)}==${line.text.slice(s, e)}==`;
      pos = e;
    });
    return `- ${out + line.text.slice(pos)}`;
  };

  function exportMarkdown() {
    if (!entries.length) return toast('書き出すノートがありません');
    const body = sorted().map((e) => [
      `## ${formatDate(e.date)}${e.title ? ` ${e.title}` : ''}`,
      '',
      `### 問い`,
      `${e.what || '—'}のはなぜか？`,
      '',
      '### 理由（WHY）',
      e.why.length ? e.why.map(lineToMd).join('\n') : '—',
      '',
      '### 結論',
      e.conclusion || '—',
      '',
      `### ${e.actionLabel}`,
      e.action.length ? e.action.map(lineToMd).join('\n') : '—',
    ].join('\n')).join('\n\n---\n\n');
    download(`言語化ノート_${today()}.md`, `# 言語化ノート\n\n${body}\n`, 'text/markdown');
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try {
        const parsed = JSON.parse(reader.result);
        incoming = Array.isArray(parsed) ? parsed : parsed.entries;
      } catch (e) { /* 下で弾く */ }
      if (!Array.isArray(incoming)) return toast('読み込めるノートが見つかりませんでした');

      const known = new Set(entries.map((e) => e.id));
      let added = 0;
      incoming.forEach((raw) => {
        const entry = normalizeEntry(raw);
        if (!entry) return;
        if (known.has(entry.id)) entry.id = uid();
        known.add(entry.id);
        entries.push(entry);
        pushCloud(entry);
        added++;
      });
      persist();
      render();
      toast(added ? `${added}件のノートを読み込みました` : '追加できるノートはありませんでした');
    };
    reader.readAsText(file);
  }

  /* =========================================================
   * 画面切り替え・起動
   * =======================================================*/
  function showView(name) {
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('is-active', v.id === `view-${name}`));
    document.querySelectorAll('.tab').forEach((t) => {
      const active = t.dataset.view === name;
      t.classList.toggle('is-active', active);
      t.setAttribute('aria-selected', String(active));
    });
  }

  el.saveBtn.addEventListener('click', save);
  $('newBtn').addEventListener('click', newEntry);
  $('printBtn').addEventListener('click', () => window.print());
  el.deleteBtn.addEventListener('click', remove);
  el.search.addEventListener('input', render);
  $('exportBtn').addEventListener('click', exportJson);
  $('exportMdBtn').addEventListener('click', exportMarkdown);
  $('importInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (file) importJson(file);
    ev.target.value = '';
  });
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => showView(t.dataset.view)));

  document.querySelectorAll('.add-line').forEach((btn) => btn.addEventListener('click', () => {
    const listEl = $(btn.dataset.add);
    focusEnd(addRow(listEl).querySelector('.line__text'));
  }));
  // 選択範囲を保ったまま押せるように、押し込みの既定動作は止め、指では touchend で実行する
  let markedByTouch = false;
  [...document.querySelectorAll('.mark-btn'), el.markFloat].forEach((btn) => {
    btn.addEventListener('touchstart', (ev) => ev.preventDefault(), { passive: false });
    btn.addEventListener('touchend', (ev) => {
      ev.preventDefault();
      markedByTouch = true;
      setTimeout(() => { markedByTouch = false; }, 600);
      toggleMark();
    });
    btn.addEventListener('mousedown', (ev) => ev.preventDefault());
    btn.addEventListener('click', () => { if (!markedByTouch) toggleMark(); });
  });
  document.addEventListener('selectionchange', updateMarkFloat);

  [el.what, el.conclusion].forEach((node) => node.addEventListener('input', () => { autoGrow(node); saveDraft(); }));
  [el.title, el.actionLabel, el.date].forEach((node) => node.addEventListener('input', saveDraft));

  document.addEventListener('keydown', (ev) => {
    if (!(ev.metaKey || ev.ctrlKey)) return;
    const key = ev.key.toLowerCase();
    if (key === 's' || (key === 'enter' && !ev.isComposing)) { ev.preventDefault(); save(); }
    if (key === 'm') { ev.preventDefault(); toggleMark(); }
  });

  el.date.value = today();
  [el.what, el.conclusion].forEach(autoGrow);
  fillList(el.whyLines);
  fillList(el.actionLines);
  if (restoreDraft()) toast('書きかけのノートを復元しました');
  render();
  connectCloud();
})();
</script>
</body>
</html>
